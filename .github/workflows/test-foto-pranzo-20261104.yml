name: Verifica trasferimento foto pranzo 2026-11-04
on:
  push:
    paths:
      - '.github/workflows/test-foto-pranzo-20261104.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Verify original image access
        env:
          HD_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1086/quality:100/uri:ifs%3A%2F%2FM%2F90a903a5-b964-45d0-a18d-145c34a67d1c/watermark:F/width:1448?csig=AAAAAAAAAAAAAAAAAAAAAKcUIEWDwzHn6PHzxmqAErWOMFQmhmrB1owfvDKU9IQi&exp=1793796546&osig=AAAAAAAAAAAAAAAAAAAAAKjR-NQEcaxzHTZSrvypQWjGK-8Iidzt1dSTU1weNCqL&signer=media-rpc&token=AAIAAU0AJDkwYTkwM2E1LWI5NjQtNDVkMC1hMThkLTE0NWMzNGE2N2QxYwAAAAABoaabHdAgAvdDwm8laOnWYx5EPR0al3a9d6Fy9uDAgf6psfuBsA'
          THUMB_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F90a903a5-b964-45d0-a18d-145c34a67d1c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKcUIEWDwzHn6PHzxmqAErWOMFQmhmrB1owfvDKU9IQi&exp=1793796546&osig=AAAAAAAAAAAAAAAAAAAAAKjR-NQEcaxzHTZSrvypQWjGK-8Iidzt1dSTU1weNCqL&signer=media-rpc&token=AAIAAU0AJDkwYTkwM2E1LWI5NjQtNDVkMC1hMThkLTE0NWMzNGE2N2QxYwAAAAABoaabHdAgAvdDwm8laOnWYx5EPR0al3a9d6Fy9uDAgf6psfuBsA&x-canva-quality=thumbnail'
        run: |
          python3 - <<'PY'
          import os,urllib.request,struct
          for k in ['HD_URL','THUMB_URL']:
            try:
              b=urllib.request.urlopen(urllib.request.Request(os.environ[k],headers={'User-Agent':'Mozilla/5.0'}), timeout=30).read()
              open('/tmp/'+k+'.png','wb').write(b)
              print(k,'len',len(b),'start',b[:12])
              if b[:8]==b'\x89PNG\r\n\x1a\n': print(k,'size',struct.unpack('>II',b[16:24]))
            except Exception as e: print(k,'ERR',str(e))
          PY
