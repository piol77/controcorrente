name: Import temporaneo foto pranzo 3 novembre
on:
  push:
    paths:
      - '.github/lunch-photos-20261103.json'
permissions:
  contents: write
jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica miniature definitive nel repository
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('.github/lunch-photos-20261103.json')
          items = json.loads(source.read_text(encoding='utf-8'))
          folder = pathlib.Path('pranzo-assets')
          folder.mkdir(exist_ok=True)
          for item in items:
              name = item['name']
              if name not in ('farfalle', 'soia', 'orecchiette', 'pollo', 'maiale', 'salmone'):
                  raise ValueError('Unexpected file name')
              url = item['url']
              if not url.startswith('https://media.canva.com/'):
                  raise ValueError('Unexpected image host')
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=35) as response:
                  data = response.read(1000000)
              if len(data) < 1000 or not data.startswith(bytes.fromhex('ffd8')):
                  raise ValueError('Image download failed: ' + name)
              path = folder / (name + '-20261103.jpg')
              path.write_bytes(data)
              print('Imported:', path, len(data))
          PY
      - name: Commit delle fotografie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pranzo-assets/farfalle-20261103.jpg pranzo-assets/soia-20261103.jpg pranzo-assets/orecchiette-20261103.jpg pranzo-assets/pollo-20261103.jpg pranzo-assets/maiale-20261103.jpg pranzo-assets/salmone-20261103.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Pranzo: aggiungi foto coerenti dei sei nuovi piatti"
            git push
          fi
