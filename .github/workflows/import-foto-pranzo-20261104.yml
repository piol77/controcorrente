name: Import foto pranzo 04-11-2026
on:
  push:
    paths:
      - '.github/workflows/import-foto-pranzo-20261104.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Download and import all eight dish photographs
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request, io
          from PIL import Image,ImageFilter,ImageEnhance
          assets = [{"name":"penne-zucchine-salsiccia","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F90a903a5-b964-45d0-a18d-145c34a67d1c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACPFSZQVXuPzvGe7iAEIRoESUFVRxMw3nr6-xklfweaf&exp=1793800146&osig=AAAAAAAAAAAAAAAAAAAAAFjwzrlZRLEJpQuEGLinu4a7_o1GFUmRrC4mF0fTFWtp&signer=media-rpc&token=AAIAAU0AJDkwYTkwM2E1LWI5NjQtNDVkMC1hMThkLTE0NWMzNGE2N2QxYwAAAAABoabSDFAB1O4IzfMhSyUUxr3cGaP1MQ2Hle1s9GYS64iRaMLbOQ&x-canva-quality=thumbnail"},{"name":"tagliatelle-funghi-mascarpone-noci","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Fc753a224-07c6-4758-a83e-110010e86335/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAJiVWUHUk6A6RlIUuIiwVeIWHq2h1hMZG0wmB7Kq-jqY&exp=1793797110&osig=AAAAAAAAAAAAAAAAAAAAAO7FHeAk6qbE581kJxsjEof6oAu8-lEs_ale3hm8W_8A&signer=media-rpc&token=AAIAAU0AJGM3NTNhMjI0LTA3YzYtNDc1OC1hODNlLTExMDAxMGU4NjMzNQAAAAABoaajuPCeb2xUPS0mU_nfupiQbmQn58F0UsOl19-680fzdklQAw&x-canva-quality=thumbnail"},{"name":"udon-verdure-pollo-gamberetti","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Ff7d1db6f-dae1-4e7c-9091-7634643dd904/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHKrypRSnPImldJEfviz76Pj8eUV0P4mWpWXnJ3HAzHL&exp=1793798957&osig=AAAAAAAAAAAAAAAAAAAAAHEylJO6BP6pepIDPrl-FOTZANdGUhQPGJnSgynlaKjP&signer=media-rpc&token=AAIAAU0AJGY3ZDFkYjZmLWRhZTEtNGU3Yy05MDkxLTc2MzQ2NDNkZDkwNAAAAAABoaa_58gFR4CVHcxt2bgdeqpII65aDib0NeVJv6Hcltuz9qle-g&x-canva-quality=thumbnail"},{"name":"calamarata-orata-olive","url":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F3f2dd429-cf47-478f-bf02-60ff30a015cd/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAIDchpREzvNzEpYXaN1VOT04wDtUhk_GZQpLgWq-byoH&exp=1793798807&osig=AAAAAAAAAAAAAAAAAAAAAC0GMSNQHP2dZGy3Z1WKFi2bve0UOMCRHvnwUy0vg81r&signer=media-rpc&token=AAIAAU0AJDNmMmRkNDI5LWNmNDctNDc4Zi1iZjAyLTYwZm