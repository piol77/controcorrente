nJWc&signer=media-rpc&token=AAIAAU0AJDBhOTIxOTkyLTA2NDUtNGY0OC05NTkwLWQ2NGM0NTA0MGYxNgAAAAABoabRrpDFQwqDG13kbn7Pti4n8CL_V9qEDkIbSToGv9j3TUKm_g&x-canva-quality=thumbnail"}]
          root = pathlib.Path('pranzo-assets');root.mkdir(exist_ok=True)
          for a in assets:
              print('Downloading',a['name'],flush=True)
              req = urllib.request.Request(a['url'],headers={'User-Agent':'Mozilla/5.0'})
              raw = urllib.request.urlopen(req,timeout=30).read()
              im = Image.open(io.BytesIO(raw)).convert('RGB')
              if im.size != (200,150): raise RuntimeError(f'Unexpected image size {im.size}')
              # Keep the original series' identical photographic composition. Upscaling avoids low-resolution artifacts in responsive cards.
              im=im.resize((1200,900),Image.Resampling.LANCZOS)
              im=im.filter(ImageFilter.UnsharpMask(radius=1.7,percent=105,threshold=3))
              target=root/(a['name']+'-20261104.webp')
              im.save(target,format='WEBP',quality=92,method=6)
              print(str(target),target.stat().st_size,flush=True)
          
          PY
      - name: Commit image assets
        run: |
          git config user.name "Controcorrente Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pranzo-assets/*-20261104.webp
          git diff --cached --quiet || git commit -m "Import foto pranzo 4 novembre 2026"
          git push
