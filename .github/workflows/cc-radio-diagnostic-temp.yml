name: Radio metadata diagnostic temporary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cc-radio-diagnostic-temp.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare Icecast stream and official LAUT metadata
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, time
          for url in ['https://newhitsradio.streamingmedia.it/play','https://stream.laut.fm/NewHitsRadio_italy']:
            print('STREAM',url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'Icy-MetaData':'1','User-Agent':'VLC/3.0.20','Origin':'https://piol77.github.io'})
              with urllib.request.urlopen(req,timeout=8) as res:
                print('status',res.status,'url',res.url,'type',res.headers.get('content-type'),
                  'icy-name',res.headers.get('icy-name'),'icy-metaint',res.headers.get('icy-metaint'),
                  'CORS',res.headers.get('access-control-allow-origin'),flush=True)
                meta_interval=int(res.headers.get('icy-metaint','0'))
                if meta_interval and meta_interval<=200000:
                  audio=res.read(meta_interval)
                  size=res.read(1)
                  if size:
                    meta=res.read(size[0]*16)
                    print('icy_song',meta.decode('utf-8','replace').strip(chr(0)),flush=True)
            except Exception as e: print('ERROR',type(e).__name__,str(e)[:180],flush=True)
          try:
            req=urllib.request.Request('https://api.laut.fm/station/newhitsradio_italy/current_song')
            with urllib.request.urlopen(req,timeout=6) as r:
              print('LAUT metadata',r.status,'CORS',r.headers.get('access-control-allow-origin'),r.read(800).decode(),flush=True)
          except Exception as e: print('LAUT_ERROR',str(e),flush=True)
          PY
