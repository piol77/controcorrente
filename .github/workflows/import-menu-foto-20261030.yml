name: Importa tre fotografie di menù (esecuzione unica)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-menu-foto-20261030.yml']
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica tre miniature originali generate per il menù
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 60 --output 'cena-assets/carciofi-fritti-20261030.png' 'https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F8be50833-3f98-495f-b940-016b16c88590/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAB3ond47PuP0KfIn11kDUah6Ly6j_PC6xdnQ1-Gk_2MG&exp=1793385332&osig=AAAAAAAAAAAAAAAAAAAAAJ3Cm6W7nz6FCBMXy0FZTnWY_oB8eQzem1Q0kD3X_rpz&signer=media-rpc&token=AAIAAU0AJDhiZTUwODMzLTNmOTgtNDk1Zi1iOTQwLTAxNmIxNmM4ODU5MAAAAAABoY4YfSC8ODguqRsOjfkkxCTLZ7YVjiOd3lW5QLvNjdgd1tMdjQ&x-canva-quality=thumbnail'
          file 'cena-assets/carciofi-fritti-20261030.png'
          test "$(wc -c < 'cena-assets/carciofi-fritti-20261030.png')" -gt 1000
          curl -fsSL --retry 2 --max-time 60 --output 'cena-assets/linguine-stracciatella-pistacchi-gamberetti-20261030.png' 'https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Fef125e29-c4fe-4227-96e6-337d6745f0da/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHnS2WutuyxYfS08cGOAWqH4NL_nx8ywVpgLH-HjyYxF&exp=1793384529&osig=AAAAAAAAAAAAAAAAAAAAAMoS0t9md5QbyitrWpbvxEqIkcULTP4PelqoPNHRhJ-p&signer=media-rpc&token=AAIAAU0AJGVmMTI1ZTI5LWM0ZmUtNDIyNy05NmU2LTMzN2Q2NzQ1ZjBkYQAAAAABoY4MPGgXH2wCOC2YkknrQPBEzQPasfojnhyqkz_xTahJn68Qzg&x-canva-quality=thumbnail'
          file 'cena-assets/linguine-stracciatella-pistacchi-gamberetti-20261030.png'
          test "$(wc -c < 'cena-assets/linguine-stracciatella-pistacchi-gamberetti-20261030.png')" -gt 1000
          curl -fsSL --retry 2 --max-time 60 --output 'offerta-assets/orecchiette-broccoli-cavolfiori-acciughe-capperi-20261030.png' 'https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Facc629ee-5994-4325-94a2-46233e7040d2/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAI-NqbcxFKqtFnRICw_AW7IjrGJbZImgu5C1U8jyYuJm&exp=1793384321&osig=AAAAAAAAAAAAAAAAAAAAAAvj8q8qg-sSzDiHsb7fs6jF0YHkBsAVXgvOKMA_U6eh&signer=media-rpc&token=AAIAAU0AJGFjYzYyOWVlLTU5OTQtNDMyNS05NGEyLTQ2MjMzZTcwNDBkMgAAAAABoY4JD-iPssCz0sRFFBuJN2bzHQi8iZ8Odsp-QElrGNWphY2D3Q&x-canva-quality=thumbnail'
          file 'offerta-assets/orecchiette-broccoli-cavolfiori-acciughe-capperi-20261030.png'
          test "$(wc -c < 'offerta-assets/orecchiette-broccoli-cavolfiori-acciughe-capperi-20261030.png')" -gt 1000
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add cena-assets/carciofi-fritti-20261030.png cena-assets/linguine-stracciatella-pistacchi-gamberetti-20261030.png offerta-assets/orecchiette-broccoli-cavolfiori-acciughe-capperi-20261030.png
          git commit -m 'Aggiunge foto per carciofi linguine e orecchiette'
          git push
