name: Pubblica foto piatti Controcorrente HD
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pubblica-foto-piatti-hd-20261027.yml'
permissions:
  contents: write
jobs:
  foto-hd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Scarica foto originali
        env:
          URL_PORCINI: 'https://media.canva.com/v2/image-resize/format:JPG/height:800/quality:90/uri:ifs%3A%2F%2FM%2F1405044e-4e98-4117-9a05-8124523a41da/watermark:F/width:1200?csig=AAAAAAAAAAAAAAAAAAAAAHvvUDGjYfnWJPJtmVRZ-5e4adGAja08P313-6MkLRyN&exp=1793144130&osig=AAAAAAAAAAAAAAAAAAAAAOWmHJzIs0213HLpmCp5JvodWnVanWWkfuEnm1_c0lbW&signer=media-rpc&token=AAIAAU0AJDE0MDUwNDRlLTRlOTgtNDExNy05YTA1LTgxMjQ1MjNhNDFkYQAAAAABoX-4CdDPTogY3gd9tfIH4sWkvIqWEusnpJuAVRyeQ4dQiXv0SQ&x-canva-quality=thumbnail'
          URL_POLLO: 'https://media.canva.com/v2/image-resize/format:JPG/height:800/quality:90/uri:ifs%3A%2F%2FM%2F993d6a42-0398-4c87-a3d7-08c8c7aed3e2/watermark:F/width:1200?csig=AAAAAAAAAAAAAAAAAAAAAJzYJ5hbGAfQ8gK3_WCW6AW3odeJJNCefvVBwj4nWYzJ&exp=1793142535&osig=AAAAAAAAAAAAAAAAAAAAALC1i5rVQyDqNbUzwM8wcjky2EBTB79ny8qhrHKOtVg7&signer=media-rpc&token=AAIAAU0AJDk5M2Q2YTQyLTAzOTgtNGM4Ny1hM2Q3LTA4YzhjN2FlZDNlMgAAAAABoX-fs1jD9zoIldgMAmJMynBdcuiB5nKsHfpT0hlBwwf0M2uL-Q&x-canva-quality=thumbnail'
        run: |
          python - <<'PY'
          import os,urllib.request
          from PIL import Image,ImageOps
          from pathlib import Path
          photos=[
            ('URL_PORCINI','cena-assets/porcini-fritti-hd-20261027.webp',False),
            ('URL_POLLO','offerta-assets/pollo-zucca-gorgonzola-hd-20261027.webp',True),
          ]
          for env,target,trim in photos:
              req=urllib.request.Request(os.environ[env],headers={'User-Agent':'Mozilla/5.0'})
              raw=urllib.request.urlopen(req,timeout=50).read()
              Path('/tmp/source.img').write_bytes(raw)
              im=Image.open('/tmp/source.img').convert('RGB')
              print(target,'source',im.size,'bytes',len(raw))
              if im.width<1000 or im.height<650: raise RuntimeError('La foto non è HD: non pubblicare')
              if trim: im=im.crop((35,0,im.width,im.height))
              im=ImageOps.fit(im,(1200,800),method=Image.Resampling.LANCZOS)
              Path(target).parent.mkdir(parents=True,exist_ok=True)
              im.save(target,'WEBP',quality=84,method=6)
              print(target,'written',Path(target).stat().st_size)
          PY
      - name: Aggiorna solo miniature e cataloghi
        run: |
          python - <<'PY'
          from pathlib import Path
          p='cena.html'; s=Path(p).read_text();old='cena-assets/porcini-fritti-nitidi-20261027.webp';new='cena-assets/porcini-fritti-hd-20261027.webp'
          assert old in s;Path(p).write_text(s.replace(old,new).replace('preordine.js?v=20261027', 'preordine.js?v=20261027'),encoding='utf8')
          p='offerta.html';s=Path(p).read_text();old='offerta-assets/pollo-zucca-gorgonzola-nitido-20261027.webp';new='offerta-assets/pollo-zucca-gorgonzola-hd-20261027.webp'
          assert old in s;Path(p).write_text(s.replace(old,new),encoding='utf8')
          for p in ['menu-data.json','menu-translations.js']:
              s=Path(p).read_text()
              assert 'cena-assets/porcini-fritti-nitidi-20261027.webp' in s
              assert 'offerta-assets/pollo-zucca-gorgonzola-nitido-20261027.webp' in s
              s=s.replace('cena-assets/porcini-fritti-nitidi-20261027.webp','cena-assets/porcini-fritti-hd-20261027.webp')
              s=s.replace('offerta-assets/pollo-zucca-gorgonzola-nitido-20261027.webp','offerta-assets/pollo-zucca-gorgonzola-hd-20261027.webp')
              Path(p).write_text(s,encoding='utf8')
          # Le cache delle due pagine forzano il refresh delle nuove immagini.
          for p in ['cena.html','offerta.html']:
              s=Path(p).read_text()
              s=s.replace('porcini-fritti-hd-20261027.webp"','porcini-fritti-hd-20261027.webp?v=2"')
              s=s.replace('pollo-zucca-gorgonzola-hd-20261027.webp"','pollo-zucca-gorgonzola-hd-20261027.webp?v=2"')
              Path(p).write_text(s,encoding='utf8')
          PY
      - name: Pubblica e rimuovi workflow temporaneo
        run: |
          git config user.name "Controcorrente AI"
          git config user.email "actions@users.noreply.github.com"
          rm -f '.github/workflows/pubblica-foto-piatti-hd-20261027.yml'
          git add cena.html offerta.html menu-data.json menu-translations.js cena-assets/porcini-fritti-hd-20261027.webp offerta-assets/pollo-zucca-gorgonzola-hd-20261027.webp '.github/workflows/pubblica-foto-piatti-hd-20261027.yml'
          git commit -m "Pubblica foto porcini e pollo in HD su sfondo nautico"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Chiudi il processo temporaneo dopo un errore
        if: failure()
        run: |
          git config user.name "Controcorrente AI"
          git config user.email "actions@users.noreply.github.com"
          rm -f '.github/workflows/pubblica-foto-piatti-hd-20261027.yml'
          git add -u '.github/workflows/pubblica-foto-piatti-hd-20261027.yml'
          git commit -m "Rimuove pubblicazione temporanea foto dopo errore" || true
          git pull --rebase origin main
          git push origin HEAD:main
