name: "Bacheca - approva o rimuovi annuncio"
on:
  workflow_dispatch:
    inputs:
      operazione:
        description: "Operazione da eseguire"
        type: choice
        required: true
        options:
          - approva
          - rimuovi
      codice:
        description: "Solo per rimuovere: codice BC-..."
        type: string
        required: false
      pseudonimo:
        description: "Per approvare: pseudonimo pubblico"
        type: string
        required: false
      tipo:
        description: "Per approvare: tipo annuncio"
        type: choice
        options:
          - VENDO
          - COMPRO
          - CERCO
          - REGALO
          - SCAMBIO
        required: true
      categoria:
        description: "Per approvare: categoria"
        type: choice
        options:
          - Casa e arredi
          - Abbigliamento
          - Elettronica
          - Libri e hobby
          - Regalo e scambio
          - Cerco
        required: true
      descrizione:
        description: "Per approvare: testo annuncio (max 200 caratteri)"
        type: string
        required: false
      prezzo:
        description: "Per approvare: prezzo o condizione"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: bacheca-approvazioni
  cancel-in-progress: false

jobs:
  aggiorna-annunci:
    runs-on: ubuntu-latest
    steps:
      - name: Recupera i file del sito
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Valida e modifica solo la lista degli annunci
        env:
          BC_OPERATION: ${{ inputs.operazione }}
          BC_CODE: ${{ inputs.codice }}
          BC_NICK: ${{ inputs.pseudonimo }}
          BC_KIND: ${{ inputs.tipo }}
          BC_CATEGORY: ${{ inputs.categoria }}
          BC_TEXT: ${{ inputs.descrizione }}
          BC_PRICE: ${{ inputs.prezzo }}
        run: python3 tools/bacheca-moderazione.py

      - name: Pubblica lista approvata
        run: |
          git config user.name "controcorrente-bacheca-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bacheca/annunci.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Bacheca: aggiorna annunci approvati"
            git push origin HEAD:main
          fi
