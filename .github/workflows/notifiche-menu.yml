name: Notifiche aggiornamento menu
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: notifiche-menu-pubblicato
  cancel-in-progress: false
jobs:
  avvisa:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Confronta i menu pubblicati e invia soltanto gli aggiornamenti effettivi
        env:
          NOTIFY_SERVICE: https://controcorrente-notifiche.superlion129.chatgpt.site/sync
        run: |
          curl --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 90 --request POST \
            "$NOTIFY_SERVICE" --output "$RUNNER_TEMP/notifiche-esito.json"
          python3 - "$RUNNER_TEMP/notifiche-esito.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          print(json.dumps(result, ensure_ascii=False))
          if result.get('failed', 0):
              raise SystemExit('Uno o più invii non sono stati accettati dal provider Push.')
          PY
