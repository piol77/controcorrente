name: Notifiche aggiornamento menu
on:
  push:
    branches: [main]
    paths:
      - menu-data.json
      - pranzo.html
      - cena.html
      - offerta.html
      - .github/workflows/notifiche-menu.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: notifiche-menu-pubblicato
  cancel-in-progress: false
jobs:
  avvisa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Attendi il buon esito di GitHub Pages per questo aggiornamento
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['REPO'] + '/actions/runs?head_sha=' + os.environ['COMMIT'] + '&per_page=30'
          for attempt in range(100):
              request = urllib.request.Request(url, headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)['workflow_runs']
              pages = [run for run in runs if run['name'] == 'pages build and deployment']
              if pages:
                  run = max(pages, key=lambda value:value['id'])
                  if run['status'] == 'completed':
                      if run['conclusion'] != 'success':
                          raise SystemExit('Pubblicazione Pages non riuscita: nessuna notifica inviata.')
                      print('GitHub Pages pubblicato con successo per questo commit.')
                      break
              time.sleep(10)
          else:
              raise SystemExit('Pubblicazione Pages non ancora confermata: nessuna notifica inviata.')
          PY
      - name: Confronta i menu pubblicati e invia soltanto gli aggiornamenti effettivi
        env:
          NOTIFY_SERVICE: https://controcorrente-notifiche.superlion129.chatgpt.site/sync
        run: |
          curl --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 90 --request POST \
            "$NOTIFY_SERVICE" --output "$RUNNER_TEMP/notifiche-esito.json"
          python3 - "$RUNNER_TEMP/notifiche-esito.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          print(json.dumps(result, ensure_ascii=False))
          if result.get('failed', 0):
              raise SystemExit('Uno o più invii non sono stati accettati dal provider Push.')
          PY
