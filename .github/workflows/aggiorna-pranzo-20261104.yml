          items=json.loads(r'''[{"name":"Penne con zucchine e salsiccia (poca panna)","price":10,"description":"Penne con zucchine e salsiccia rosolata, legate da un leggero tocco di panna.","allergens":[1,7],"icon":"Wheat","orderCourse":"Primo","photoLayout":"side","dishPhoto":"pranzo-assets/penne-zucchine-salsiccia-20261104.webp","translations":{"en":{"name":"Penne with courgettes and sausage (a little cream)","description":"Penne with sautéed courgettes and browned sausage, finished with a light touch of cream."},"zh":{"name":"西葫芦香肠奶油通心粉（少量奶油）","description":"通心粉搭配西葫芦与香煎香肠，仅用少许奶油调和。"}},"photoSource":{"type":"AI-generated food illustration, website-optimized preview","date":"2026-11-04","tool":"image_gen / Canva media preview","resolution":"1200x900 pixels (upscaled from 200x150 preview)","note":"Piatto illustrato con gli ingredienti richiesti, sfondo uniforme in ceramica avorio e legno scuro. Il file pubblicato è una versione ingrandita della miniatura, non la versione HD originale né una foto del piatto reale."}},{"name":"Tagliatelle ai funghi misti, mascarpone e noci","price":10,"description":"Funghi misti e mascarpone avvolgono le tagliatelle, completate dalla croccantezza delle noci.","allergens":[1,3,7,8],"icon":"Wheat","orderCourse":"Primo","photoLayout":"side","dishPhoto":"pranzo-assets/tagliatelle-funghi-mascarpone-noci-20261104.webp","translations":{"en":{"name":"Tagliatelle with mixed mushrooms, mascarpone and walnuts","description":"Mixed mushrooms and creamy mascarpone dress the tagliatelle, finished with crunchy walnuts."},"zh":{"name":"什锦蘑菇马斯卡彭奶酪核桃宽面","description":"什锦蘑菇与马斯卡彭奶酪包裹宽面，撒上香脆核桃。"}},"photoSource":{"type":"AI-generated food illustration, website-optimized preview","date":"2026-11-04","tool":"image_gen / Canva media preview","resolution":"1200x900 pixels (upscaled from 200x150 preview)","note":"Piatto illustrato con gli ingredienti richiesti, sfondo uniforme in ceramica avorio e legno scuro. Il file pubblicato è una versione ingrandita della miniatura, non la versione HD originale né una foto del piatto reale."}},{"name":"Udon con verdure miste, pollo e gamberetti*","price":10,"description":"Udon saltati con pollo, gamberetti*, carote, zucchine e verza.","allergens":[1,2,6],"icon":"Wheat","orderCourse":"Primo","photoLayout":"side","dishPhoto":"pranzo-assets/udon-verdure-pollo-gamberetti-20261104.webp","translations":{"en":{"name":"Udon with mixed vegetables, chicken and shrimp*","description":"Stir-fried udon with chicken, shrimp*, carrots, courgettes and savoy cabbage."},"zh":{"name":"什锦蔬菜鸡肉虾仁*乌冬面","description":"乌冬面搭配鸡肉、虾仁*、胡萝卜、西葫芦和皱叶甘蓝。"}},"photoSource":{"type":"AI-generated food illustration, website-optimized preview","date":"2026-11-04","tool":"image_gen / Canva media preview","resolution":"1200x900 pixels (upscaled from 200x150 preview)","note":"Piatto illustrato con gli ingredienti richiesti, sfondo uniforme in ceramica avorio e legno scuro. Il file pubblicato è una versione ingrandita della miniatura, non la versione HD originale né una foto del piatto reale."}},{"name":"Calamarata al sugo di orata, olive e pomodoro","price":12,"description":"Calamarata con delicati bocconcini di orata, olive e pomodoro, leggermente piccante.","allergens":[1,4],"icon":"Fish","orderCourse":"Primo","photoLayout":"side","dishPhoto":"pranzo-assets/calamarata-orata-olive-20261104.webp","translations":{"en":{"name":"Calamarata with sea bream, olives and tomato","description":"Calamarata pasta with tender sea bream, olives and tomato sauce, mildly spicy."},"zh":{"name":"金头鲷橄榄番茄鱿鱼圈形意面","description":"鱿鱼圈形意面搭配鲜嫩金头鲷、橄榄与番茄酱，略带微辣。"}},"photoSource":{"type":"AI-generated food illustration, website-optimized preview","date":"2026-11-04","tool":"image_gen / Canva media preview","resolution":"1200x900 pixels (upscaled from 200x150 preview)","note":"Piatto illustrato con gli ingredienti richiesti, sfondo uniforme in ceramica avorio e legno scuro. Il file pubblicato è una versione ingrandita della miniatura, non la versione HD originale né una foto del piatto reale."}},{"name":"Orata alla griglia con patate lesse prezzemolate","price":12,"description":"Orata grigliata, accompagnata da patate lesse condite con prezzemolo.","allergens":[4],"icon":"Fish","orderCourse":"Secondo","photoLayout":"side","dishPhoto":"pranzo-assets/orata-griglia-patate-20261104.webp","translations":{"en":{"name":"Grilled sea bream with parsley boiled potatoes","description":"Grilled sea bream served with boiled potatoes dressed with parsley."},"zh":{"name":"香烤金头鲷配欧芹水煮土豆","description":"烤金头鲷配以欧芹调味的水煮土豆。"}},"photoSource":{"type":"AI-generated food illustration, website-optimized preview","date":"2026-11-04","tool":"image_gen / Canva media preview","resolution":"1200x900 pixels (upscaled from 200x150 preview)","note":"Piatto illustrato con gli ingredienti richiesti, sfondo uniforme in ceramica avorio e legno scuro. Il file pubblicato è una versione ingrandita della miniatura, non la versione HD originale né una foto del piatto reale."}},{"name":"Filetti di orata alle mandorle con verza e carote saltate","price":12,"description":"Filetti di orata con mandorle croccanti, serviti su verza e carote saltate.","allergens":[4,8],"icon":"Fish","orderCourse":"Secondo","photoLayout":"side","dishPhoto":"pranzo-assets/orata-mandorle-verza-carote-20261104.webp","translations":{"en":{"name":"Almond sea bream fillets with sautéed savoy cabbage and carrots","description":"Sea bream fillets with crunchy almonds, accompanied by sautéed savoy cabbage and carrots."},"zh":{"name":"杏仁金头鲷鱼柳配炒皱叶甘蓝与胡萝卜","description":"金头鲷鱼柳佐香脆杏仁，搭配炒皱叶甘蓝和胡萝卜。"}},"photoSource":{"type":"AI-generated food illustration, website-optimized preview","date":"2026-11-04","tool":"image_gen / Canva media preview","resolution":"1200x900 pixels (upscaled from 200x150 preview)","note":"Piatto illustrato con gli ingredienti richiesti, sfondo uniforme in ceramica avorio e legno scuro. Il file pubblicato è una versione ingrandita della miniatura, non la versione HD originale né una foto del piatto reale."}},{"name":"Straccetti di pollo con verdure in salsa di soia e riso bianco al vapore","price":10,"description":"Pollo saltato con carote e zucchine in salsa di soia, accompagnato da riso bianco al vapore.","allergens":[1,6],"icon":"Utensils","orderCourse":"Secondo","photoLayout":"side","dishPhoto":"pranzo-assets/straccetti-pollo-soia-riso-20261104.webp","translations":{"en":{"name":"Chicken strips with vegetables in soy sauce and steamed white rice","description":"Chicken sautéed with carrots and courgettes in soy sauce, served with steamed white rice."},"zh":{"name":"酱油蔬菜鸡肉条配蒸白米饭","description":"鸡肉条与胡萝卜、西葫芦一起用酱油翻炒，搭配蒸白米饭。"}},"photoSource":{"type":"AI-generated food illustration, website-optimized preview","date":"2026-11-04","tool":"image_gen / Canva media preview","resolution":"1200x900 pixels (upscaled from 200x150 preview)","note":"Piatto illustrato con gli ingredienti richiesti, sfondo uniforme in ceramica avorio e legno scuro. Il file pubblicato è una versione ingrandita della miniatura, non la versione HD originale né una foto del piatto reale."}},{"name":"Insalatona con arance, finocchi, avocado e salmone fresco all’aceto balsamico","price":12,"description":"Arance, finocchi croccanti e avocado con bocconcini di salmone fresco, conditi con aceto balsamico.","allergens":[4],"icon":"Fish","orderCourse":"Secondo","photoLayout":"side","dishPhoto":"pranzo-assets/insalatona-salmone-arance-avocado-20261104.webp","translations":{"en":{"name":"Large salad with orange, fennel, avocado and fresh salmon with balsamic vinegar","description":"Orange, crisp fennel and avocado with fresh salmon bites, dressed with balsamic vinegar."},"zh":{"name":"橙子茴香牛油果鲜三文鱼沙拉配香醋","description":"橙子、爽脆茴香和牛油果搭配鲜三文鱼块，淋上意大利香醋。"}},"photoSource":{"type":"AI-generated food illustration, website-optimized preview","date":"2026-11-04","tool":"image_gen / Canva media preview","resolution":"1200x900 pixels (upscaled from 200x150 preview)","note":"Piatto illustrato con gli ingredienti richiesti, sfondo uniforme in ceramica avorio e legno scuro. Il file pubblicato è una versione ingrandita della miniatura, non la versione HD originale né una foto del piatto reale."}}]''')
          assert len(items)==8
          for x in items:
              assert (root/x['dishPhoto']).is_file(),x['dishPhoto']
          d['lunch']=items
          (root/'menu-data.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          
          PY
          python3 tools/aggiorna-menu.py pranzo
      - name: Validate displayed dishes and prices
        run: |
          python3 - <<'PY'
          import json
          from lxml import html
          d=json.load(open('menu-data.json'))
          h=html.parse('pranzo.html')
          names=h.xpath('//article[contains(@class,"lunch-dish")]//h3/text()')
          prices=h.xpath('//article[contains(@class,"lunch-dish")]//strong[contains(@class,"dish-price")]/text()')
          assert len(names)==len(prices)==len(d['lunch'])==8
          for i,x in enumerate(d['lunch']):
              assert names[i]==x['name'],(i,names[i],x['name'])
              assert prices[i]==f"{x['price']:.2f} €".replace('.',','),(i,prices[i])
          assert h.xpath('//time[@datetime="2026-11-04"]')
          print('Verified 8 dishes and 8 prices for 4 November')
          PY
      - name: Commit only lunch menu files
        run: |
          git config user.name "Controcorrente Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-data.json pranzo.html menu-build-state.json
          git diff --cached --quiet || git commit -m "Pubblica pranzo 4 novembre: otto piatti, foto, traduzioni e prezzi"
          git push
