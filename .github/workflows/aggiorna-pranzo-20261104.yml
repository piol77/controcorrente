name: Aggiornamento pranzo 4 novembre 2026
on:
  push:
    paths:
      - '.github/workflows/aggiorna-pranzo-20261104.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install menu rendering dependencies
        run: python -m pip install lxml cssselect
      - name: Update catalog and lunch page with existing site renderer
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
