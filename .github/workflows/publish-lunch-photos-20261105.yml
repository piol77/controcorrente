name: Pubblica le otto fotografie uniformi del pranzo del 5 novembre
on:
  push:
    paths:
      - '.github/workflows/publish-lunch-photos-20261105.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Estrai fotografie e sincronizza esclusivamente le otto schede pranzo
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,pathlib,re,zipfile
          root=pathlib.Path('.')
          payload=''.join((root/'.github/lunch-photos-20261105.b64').read_text().split())
          archived=base64.b64decode(payload,validate=True)
          actual=hashlib.sha256(archived).hexdigest()
          expected_sha='9a806a365829061bd496c56aa2085f6402ba14d7b64c27856a2719f6b9ae886a'
          if actual!=expected_sha: raise RuntimeError('Archivio immagini non integro: '+actual)
          slugs=[
            'casarecce-melanzane-branzino',
            'spaghetti-salsiccia-zafferano',
            'penne-panna-prosciutto-piselli',
            'rigatoni-cacio-pepe',
            'straccetti-lonza-birra-patate',
            'pollo-griglia-verza-viola',
            'polpettine-carne-mista-sugo-patate',
            'insalatona-salmone-arance-avocado']
          expected=['pranzo-assets/'+slug+'-uniform-20261105.webp' for slug in slugs]
          with zipfile.ZipFile(io.BytesIO(archived)) as z:
            actual_names=z.namelist()
            if len(actual_names)!=8 or set(actual_names)!=set(expected):
              raise RuntimeError('L archivio non contiene esattamente le otto foto attese')
            for name in expected:
              raw=z.read(name)
              if len(raw)<10000 or raw[:4]!=b'RIFF' or raw[8:12]!=b'WEBP':
                raise RuntimeError('Foto non valida: '+name)
              path=root/name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(raw)
              print('Installata',name,len(raw))
          path=root/'menu-data.json'
          menu=json.loads(path.read_text(encoding='utf-8'))
          lunch=menu['lunch']
          if len(lunch)!=8: raise RuntimeError('Il numero dei piatti e cambiato: evitare sovrascritture')
          before=[(d['name'],d['price'],d['description'],d.get('allergens')) for d in lunch]
          html_path=root/'pranzo.html'
          html=html_path.read_text(encoding='utf-8')
          for index,(dish,slug) in enumerate(zip(lunch,slugs)):
            old=dish.get('dishPhoto','')
            if old!='pranzo-assets/'+slug+'-20261105.webp':
              raise RuntimeError('Piatto inatteso '+str(index)+' '+old)
            new=expected[index]
            if html.count('src="'+old+'"')!=1:
              raise RuntimeError('Foto precedente non unica in pranzo.html: '+old)
            html=html.replace('src="'+old+'"','src="'+new+'"')
            pattern=r'(<img\s+class="dish-photo"\s+src="'+re.escape(new)+r'"[^>]*?height=")800(")'
            html,count=re.subn(pattern,r'\g<1>600\2',html)
            if count!=1: raise RuntimeError('Attributo altezza inatteso: '+new)
            dish['dishPhoto']=new
            dish['photoSource']={
              'type':'Illustrazione fotografica AI coordinata; immagine WebP per menu',
              'date':'2026-11-05',
              'tool':'image_gen / ritaglio autonomo / uniformazione sfondo',
              'resolution':'1200 x 600 px (immagine derivata da tavola originale di otto fotografie)',
              'note':'Piatto avorio, tavolo blu scuro, stessa luce, prospettiva e scala degli altri sette piatti; nessun elemento grafico del sito modificato. Immagine illustrativa, non fotografia del ristorante.'
            }
          after=[(d['name'],d['price'],d['description'],d.get('allergens')) for d in lunch]
          if before!=after: raise RuntimeError('Sono cambiati nomi, descrizioni, allergeni o prezzi')
          path.write_text(json.dumps(menu,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          digest=hashlib.sha256(json.dumps(lunch,sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          (root/'menu-build-state.json').write_text(json.dumps({'lunchDigest':digest},indent=2)+'\n',encoding='utf-8')
          html_path.write_text(html,encoding='utf-8')
          for filename in expected:
            if html.count('src="'+filename+'"')!=1:
              raise RuntimeError('Foto non presente nella pagina: '+filename)
          print('Otto foto confermate. Testi, prezzi, allergeni, data e layout invariati.')
          PY
      - name: Pubblica i file su main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-data.json menu-build-state.json pranzo.html pranzo-assets/*-uniform-20261105.webp
          if ! git diff --cached --quiet; then
            git commit -m "Pranzo: otto fotografie uniformi, sfondo e impiattamento coerenti"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
