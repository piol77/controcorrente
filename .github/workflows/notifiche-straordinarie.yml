name: Saluto quotidiano Controcorrente

# Invio quotidiano, con eccezione manuale una tantum del 26/10/2026.
# Deduplica sempre per giorno italiano. 09:00 UTC = 10:00 CET / 11:00 CEST.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notifiche-straordinarie.yml'
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: controcorrente-notifica-giornaliera
  cancel-in-progress: false

jobs:
  saluto:
    if: github.repository == 'piol77/controcorrente' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invia un saluto e invita alle proposte del giorno
        env:
          PUSH_URL: https://controcorrente-notifiche.superlion129.chatgpt.site/admin/notify
        run: |
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          import json
          import os
          import urllib.error
          import urllib.request

          now = datetime.now(timezone.utc)
          local = now.astimezone(ZoneInfo("Europe/Rome"))
          weekday = local.weekday()
          if weekday == 0:
              body = "Buon inizio settimana da Controcorrente! 🌊😅 Oggi siamo chiusi, ma domani si riapre! Scopri le proposte sul sito."
          elif weekday == 5:
              body = "Buon sabato da Controcorrente! 🌊🍽️ Guarda le proposte sul sito. Nel weekend siamo aperti su prenotazione."
          elif weekday == 6:
              body = "Buona domenica da Controcorrente! 🌊🍽️ Scopri le proposte sul sito. Nel weekend siamo aperti su prenotazione."
          else:
              body = "Buongiorno da Controcorrente! 🌊🍽️ Scopri le proposte del giorno aggiornate sul nostro sito."

          # Stesso identificatore per la medesima data italiana anche in caso
          # di riavvio/riesecuzione: il server gestisce il requestId idempotente.
          request_id = "cc-saluto-" + local.strftime("%Y%m%d")
          payload = {
              "requestId": request_id,
              "kind": "manual",
              "body": body,
              "url": "https://piol77.github.io/controcorrente/",
              "expiresAt": int((now + timedelta(minutes=3)).timestamp() * 1000),
          }
          audience = "https%3A%2F%2Fcontrocorrente-notifiche.superlion129.chatgpt.site"
          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + audience
          oidc_req = urllib.request.Request(
              oidc_url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(oidc_req, timeout=15) as response:
              token = json.load(response)["value"]

          request = urllib.request.Request(
              os.environ["PUSH_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "Cache-Control": "no-store",
                  "User-Agent": "Controcorrente-Daily-Greetings/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit("Servizio notifiche HTTP " + str(exc.code))
          if not isinstance(result, dict):
              raise SystemExit("Esito invio non valido.")
          print("Saluto quotidiano:", local.strftime("%Y-%m-%d"), json.dumps({
              key: result.get(key)
              for key in ("subscribers", "accepted", "failed", "expired", "duplicate")
              if key in result
          }, ensure_ascii=False))
          if result.get("failed", 0):
              raise SystemExit("Alcuni invii non sono stati accettati dal provider Push.")
          PY
