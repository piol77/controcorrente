name: Aggiorna notizie e meteo Controcorrente

# Controllo ogni ora: pubblica solo nelle 4/2 finestre locali previste.
# Se GitHub ritarda o salta un avvio, il controllo successivo recupera.
on:
  schedule:
    - cron: '23 * * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aggiorna-novita.yml'
      - 'scripts/update-news.py'
      - 'scripts/update-weather.py'

permissions:
  contents: write
  pages: write

concurrency:
  group: controcorrente-notizie-meteo
  cancel-in-progress: false

jobs:
  aggiorna:
    if: github.repository == 'piol77/controcorrente' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Leggi versione corrente del ramo main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Verifica quali aggiornamenti sono dovuti
        id: due
        env:
          FORCE_UPDATE: ${{ github.event_name != 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          rome = ZoneInfo("Europe/Rome")
          now = datetime.now(rome)
          force = os.environ.get("FORCE_UPDATE", "").lower() == "true"
          # Quattro acquisizioni notizie: 07:20, 11:20, 15:20, 20:20.
          # Due acquisizioni meteo: 07:20 e 15:20.
          def needed(filename, hours):
              if force:
                  return True
              cutoffs = [datetime.combine(now.date(), time(hour, 20), tzinfo=rome)
                         for hour in hours]
              eligible = [value for value in cutoffs if now >= value]
              if not eligible:
                  return False
              try:
                  data = json.loads(Path(filename).read_text(encoding="utf-8"))
                  fetched = datetime.fromisoformat(data["fetched_at"].replace("Z", "+00:00"))
                  if fetched.tzinfo is None:
                      return True
                  return fetched.astimezone(rome) < max(eligible)
              except (OSError, ValueError, KeyError, TypeError):
                  return True

          news = needed("news.json", [7, 11, 15, 20])
          weather = needed("weather.json", [7, 15])
          print("news=" + str(news).lower())
          print("weather=" + str(weather).lower())
          print("Notizie dovute:", news, "Meteo dovuto:", weather,
                "Ora locale:", now.isoformat(), file=__import__("sys").stderr)
          PY

      - name: Acquisisci le fonti dovute in modo indipendente con ritentativo
        id: sync
        env:
          NEWS_DUE: ${{ steps.due.outputs.news }}
          WEATHER_DUE: ${{ steps.due.outputs.weather }}
        shell: bash
        run: |
          set -euo pipefail
          successes=0
          failures=0
          for kind in news weather; do
            due_var="${kind^^}_DUE"
            if [[ "${!due_var}" != "true" ]]; then
              echo "Salto $kind: finestra odierna già aggiornata (o non ancora prevista)."
              continue
            fi
            if python3 "scripts/update-$kind.py" --output "$kind.json"; then
              successes=$((successes + 1))
            else
              echo "::warning::Acquisizione $kind fallita; riprovo."
              sleep 10
              if python3 "scripts/update-$kind.py" --output "$kind.json"; then
                successes=$((successes + 1))
              else
                failures=$((failures + 1))
                echo "::error::Fonte $kind non disponibile; precedente JSON conservato."
              fi
            fi
          done
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          if (( successes == 0 && failures > 0 )); then
            echo "::error::Nessuna fonte dovuta ha prodotto dati validi."
            exit 1
          fi

      - name: Salva solo i JSON realmente aggiornati
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- news.json weather.json; then
            echo "Nessun cambiamento da pubblicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news.json weather.json
          git commit -m "Novità: aggiorna le fonti previste (4 notizie / 2 meteo)"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Richiedi la pubblicazione GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Usa lo status HTTP: una risposta riuscita ma con corpo vuoto
          # non deve essere scambiata per un errore di parsing JSON.
          status=$(curl --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --output /tmp/controcorrente-pages-build.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")
          if [[ "$status" != 2* ]]; then
            echo "::error::Richiesta Pages non confermata (HTTP $status)."
            exit 1
          fi
          echo "GitHub Pages: build richiesto correttamente (HTTP $status)."

      - name: Segnala fonti eventualmente non aggiornate
        if: steps.sync.outputs.failures != '0'
        run: |
          echo "::error::Almeno una fonte non si è aggiornata: verificare il log."
          exit 1
