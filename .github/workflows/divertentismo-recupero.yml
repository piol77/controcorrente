name: Recupero automatico Divertentismo (solo se manca)

# L'automazione creativa delle 08:00 resta prioritaria; questo è un
# controllo di sicurezza. Pubblica al massimo una vignetta daily al giorno.
on:
  schedule:
    - cron: '27 9,12,16,20,22 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/divertentismo-recupero.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: controcorrente-divertentismo-recupero
  cancel-in-progress: false

jobs:
  recupera:
    if: github.repository == 'piol77/controcorrente' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Leggi pagina aggiornata su main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Aggiungi una vignetta solo se manca l'edizione quotidiana
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/recupera-divertentismo.py

      - name: Pubblica soltanto in caso di vignetta mancante
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- divertentismo.html; then
            echo "Nessuna vignetta da recuperare: pagina invariata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- divertentismo.html
          git commit -m "Divertentismo: recupera vignetta daily mancante"
          if ! git push origin HEAD:main; then
            # Il ramo è cambiato durante la scrittura: riparti dalla
            # versione appena pubblicata e rivaluta la presenza del daily.
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/recupera-divertentismo.py
            if git diff --quiet -- divertentismo.html; then
              echo "Un'altra esecuzione ha già pubblicato: niente doppione."
              exit 0
            fi
            git add -- divertentismo.html
            git commit -m "Divertentismo: recupera vignetta daily mancante"
            git push origin HEAD:main
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Pubblica su GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Usa lo status HTTP: una risposta riuscita ma con corpo vuoto
          # non deve essere scambiata per un errore di parsing JSON.
          status=$(curl --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --output /tmp/controcorrente-pages-build.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")
          if [[ "$status" != 2* ]]; then
            echo "::error::Richiesta Pages non confermata (HTTP $status)."
            exit 1
          fi
          echo "GitHub Pages: build richiesto correttamente (HTTP $status)."
