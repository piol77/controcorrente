name: Recupero automatico Divertentismo (solo se manca)

# L'automazione creativa delle 08:00 resta prioritaria; questo è un
# controllo di sicurezza. Pubblica al massimo una vignetta daily al giorno.
on:
  schedule:
    - cron: '27 9,12,16,20,22 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/divertentismo-recupero.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: controcorrente-divertentismo-recupero
  cancel-in-progress: false

jobs:
  recupera:
    if: github.repository == 'piol77/controcorrente' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Leggi pagina aggiornata su main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Aggiungi una vignetta solo se manca l'edizione quotidiana
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/recupera-divertentismo.py

      - name: Pubblica soltanto in caso di vignetta mancante
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- divertentismo.html; then
            echo "Nessuna vignetta da recuperare: pagina invariata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- divertentismo.html
          git commit -m "Divertentismo: recupera vignetta daily mancante"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            # Controllo dopo rebase: non creare doppioni se l'altra automazione
            # ha già pubblicato contemporaneamente.
            python3 scripts/recupera-divertentismo.py
            git add -- divertentismo.html
            git commit --amend --no-edit
            git push origin HEAD:main
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Pubblica su GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
